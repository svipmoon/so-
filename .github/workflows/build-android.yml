name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'cmd/**'
      - 'pkg/**'
      - 'stub/**'
      - 'vmp-gui-android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- 1. ARM64 交叉编译工具链 ----------
      - name: Install ARM64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu python3

      # ---------- 2. Go ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      # ---------- 3. 编译 VM 解释器 stub → vm_interp.bin ----------
      - name: Build VM interpreter stub
        run: |
          bash scripts/build_stub_linux.sh

      # ---------- 4. 编译 vmpacker (ARM64 Linux 静态二进制) ----------
      - name: Build vmpacker (ARM64 Linux)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -o build/vmpacker_arm64 ./cmd/vmpacker/
          mkdir -p vmp-gui-android/app/assets
          cp build/vmpacker_arm64 vmp-gui-android/app/assets/vmpacker_arm64
          ls -la vmp-gui-android/app/assets/

      # ---------- 5. JDK 17 ----------
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ---------- 6. Gradle ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ---------- 7. 构建 APK ----------
      - name: Build APK
        working-directory: vmp-gui-android
        run: gradle assembleDebug --no-daemon

      # ---------- 8. 上传产物 ----------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vmpacker-android-apk
          path: vmp-gui-android/app/build/outputs/apk/debug/*.apk

      - name: Upload vmpacker binary
        uses: actions/upload-artifact@v4
        with:
          name: vmpacker-arm64-bin
          path: build/vmpacker_arm64